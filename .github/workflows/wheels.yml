# Binary wheels: build with cibuildwheel, repair (auditwheel / delocate /
# delvewheel), then install each wheel in a clean environment on its own
# platform and test it.  Artifacts only -- nothing is published.
#
# ppc64le, s390x and riscv64 are built and tested under QEMU on x86_64
# runners; musllinux natively.  Those five are tested outside
# cibuildwheel, in clean containers (test-linux).  Windows ARM64 is only
# probed (experimental): no wheel is built for it.
name: wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64,  os: ubuntu-24.04,     archs: x86_64}
          - {name: linux-aarch64, os: ubuntu-24.04-arm, archs: aarch64}
          - {name: linux-ppc64le, os: ubuntu-24.04,     archs: ppc64le, qemu: true}
          - {name: linux-s390x,   os: ubuntu-24.04,     archs: s390x,   qemu: true}
          - {name: linux-riscv64, os: ubuntu-24.04,     archs: riscv64, qemu: true}
          - {name: musllinux-x86_64,  os: ubuntu-24.04,     archs: x86_64,  build: "cp312-musllinux_*"}
          - {name: musllinux-aarch64, os: ubuntu-24.04-arm, archs: aarch64, build: "cp312-musllinux_*"}
          - {name: macos-arm64,   os: macos-15,         archs: arm64,  target: "11.0"}
          - {name: macos-x86_64,  os: macos-15-intel,   archs: x86_64, target: "11.0"}
          - {name: windows-amd64, os: windows-latest,   archs: AMD64}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.qemu

      # macOS: conda-forge gfortran (+ its clang driver), whose runtime
      # libraries target macOS 11.0 -- the toolchain used to build and
      # verify the local macOS 11.0 arm64 and x86_64 wheels.
      - name: gfortran (macOS, conda-forge)
        if: runner.os == 'macOS'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fortran
          create-args: gfortran clang
      - name: Use the conda-forge toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "$MAMBA_ROOT_PREFIX/envs/fortran/bin" >> "$GITHUB_PATH"
          echo "FC=$MAMBA_ROOT_PREFIX/envs/fortran/bin/gfortran" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      # Windows: MSYS2 UCRT64 gfortran, CMake and make; static CFITSIO
      # built from the pinned source with the same script.
      - name: MSYS2 toolchain (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            curl
      - name: Static CFITSIO (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # cfortran.h assumes MS PowerStation Fortran whenever WIN32 is defined,
        # which gives the Fortran wrappers (ftgkyj etc.) names gfortran cannot
        # link against. -UWIN32 -DgFortran selects gfortran conventions
        # (lowercase_, trailing string lengths); in CFITSIO, WIN32 (as opposed
        # to _WIN32) only controls DLL exports, unused in a static build.
        run: |
          CFLAGS="-UWIN32 -DgFortran" CFITSIO_CMAKE_GENERATOR=Ninja \
              bash tools/ci/build_cfitsio.sh /c/cfitsio
          nm /c/cfitsio/lib/libcfitsio.a | grep -E ' T (ftgkyj_|ftinit_|ftvers_)$'
      - name: Put the MSYS2 toolchain on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" >> "$GITHUB_PATH"
          echo "CFITSIO_DIR=C:/cfitsio" >> "$GITHUB_ENV"

      - uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD: ${{ matrix.build || 'cp312-manylinux_* cp312-macosx_* cp312-win_*' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl

  test:
    name: test ${{ matrix.name }} / Python ${{ matrix.python }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64, windows-amd64]
        python: ["3.10", "3.12", "3.13"]
        include:
          - {name: linux-x86_64,  os: ubuntu-24.04}
          - {name: linux-aarch64, os: ubuntu-24.04-arm}
          - {name: macos-arm64,   os: macos-15}
          - {name: macos-x86_64,  os: macos-15-intel}
          - {name: windows-amd64, os: windows-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: "wheel-${{ matrix.name }}", path: wheelhouse}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}

      # Linux: test inside a compiler-free container
      - name: Clean-container test (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -e ELLIPROF_TEST_REQUIRE_NO_COMPILER=1 \
            -v "$PWD:/project:ro" python:${{ matrix.python }}-slim sh -c '
              pip install /project/wheelhouse/*.whl pytest astropy &&
              apt-get -qq update && apt-get -qq install -y binutils >/dev/null &&
              python /project/tools/ci/check_backend_deps.py &&
              cd /tmp && python -m pytest -c /project/tests/packaging/pytest.ini /project/tests/packaging'

      # macOS / Windows: fresh venv, dependency check, smoke tests
      - name: Clean-venv test (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m venv /tmp/clean && source /tmp/clean/bin/activate 2>/dev/null || source /tmp/clean/Scripts/activate
          pip install wheelhouse/*.whl pytest astropy
          python tools/ci/check_backend_deps.py
          cd "$RUNNER_TEMP" && python -m pytest -c "$GITHUB_WORKSPACE/tests/packaging/pytest.ini" "$GITHUB_WORKSPACE/tests/packaging"

      - name: Regression outputs from the installed wheel
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python -m pip install wheelhouse/*.whl
          python -m pip install numpy pandas astropy
          ELLIPROF_NATIVE="$(python -c 'import elliprof; print(elliprof.find_backend())')" \
            python tests/regression/collect_outputs.py spread/wheel-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with: {name: "wheel-spread-${{ matrix.name }}", path: spread/}

  # manylinux ppc64le / s390x / riscv64 (QEMU) and musllinux: clean
  # containers without a compiler or CFITSIO.  Debian trixie supplies
  # numpy/pandas/astropy where PyPI has no wheels for them.
  test-linux:
    name: test ${{ matrix.name }} (clean container)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-ppc64le, os: ubuntu-24.04, platform: linux/ppc64le, image: "debian:trixie-slim", mode: apt, qemu: true}
          - {name: linux-s390x,   os: ubuntu-24.04, platform: linux/s390x,   image: "debian:trixie-slim", mode: apt, qemu: true}
          - {name: linux-riscv64, os: ubuntu-24.04, platform: linux/riscv64, image: "debian:trixie-slim", mode: apt, qemu: true}
          - {name: musllinux-x86_64,  os: ubuntu-24.04,     platform: linux/amd64, image: "python:3.12-alpine", mode: pip}
          - {name: musllinux-aarch64, os: ubuntu-24.04-arm, platform: linux/arm64, image: "python:3.12-alpine", mode: pip, prebuild: astropy}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: "wheel-${{ matrix.name }}", path: wheelhouse}
      - uses: docker/setup-qemu-action@v3
        if: matrix.qemu
      # PyPI has no wheel of astropy (a test dependency) for this
      # platform: build one in a separate, throw-away container so the
      # test container itself never has a compiler.
      - name: Prebuild ${{ matrix.prebuild }}
        if: matrix.prebuild
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD/deps:/deps" ${{ matrix.image }} \
            sh -c 'apk add --no-cache build-base >/dev/null && pip wheel -q -w /deps ${{ matrix.prebuild }}'
          ls deps
      - name: Clean-container test
        run: |
          mkdir -p spread
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/project:ro" -v "$PWD/spread:/spread" ${{ matrix.image }} \
            sh /project/tools/ci/test_wheel_linux.sh ${{ matrix.mode }} wheel-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with: {name: "wheel-spread-${{ matrix.name }}", path: spread/}

  # Numerical differences of every tested wheel from the committed baselines
  spread:
    name: Numerical spread of the wheels
    needs: [test, test-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install numpy pandas astropy
      - uses: actions/download-artifact@v4
        with: {path: spread, pattern: wheel-spread-*, merge-multiple: true}
      - name: Compare with the committed baselines
        run: |
          PYTHONPATH=python python tests/regression/compare_platforms.py \
            tests/regression/baseline spread/* | tee spread-report.md
      - uses: actions/upload-artifact@v4
        with: {name: wheel-spread-report, path: spread-report.md}

  # EXPERIMENTAL: Windows ARM64.  MSYS2 has no gfortran for ARM64, only
  # LLVM flang, which the wheel build does not accept (CMakeLists.txt
  # requires GNU Fortran).  This job only records what the toolchain can
  # do -- the numerical flags, a CFITSIO build, a flang-built backend
  # and its regression outputs -- and builds no wheel.  Allowed to fail.
  windows-arm64-probe:
    name: experimental windows-arm64 (toolchain probe)
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: CLANGARM64
          install: >-
            mingw-w64-clang-aarch64-flang
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-zlib
            make curl
      - name: Fortran compilers available
        shell: msys2 {0}
        run: |
          pacman -Ss fortran | grep -i -A1 aarch64 || true
          command -v gfortran && gfortran --version || echo "no gfortran in CLANGARM64"
          flang --version
          printf '      PROGRAM T\n      PRINT *, 1.0\n      END\n' > t.f
          for f in -O -g -fno-automatic -ffp-contract=off; do
            if flang $f -c t.f -o t.o 2> err.txt; then echo "flag accepted: $f"
            else echo "flag REJECTED: $f: $(cat err.txt)"; fi
          done
      - name: CFITSIO and a flang-built backend (not a wheel)
        shell: msys2 {0}
        run: |
          CFLAGS="-UWIN32 -DgFortran" CFITSIO_CMAKE_GENERATOR=Ninja \
              bash tools/ci/build_cfitsio.sh /c/cfitsio
          nm /c/cfitsio/lib/libcfitsio.a | grep -E ' T (ftgkyj_|ftinit_|ftvers_)$'
          make elliprof_native FC=flang CFITSIO= LDLIBS="-L/c/cfitsio/lib -lcfitsio -lz"
          [ -f elliprof_native.exe ] || mv elliprof_native elliprof_native.exe
          ./elliprof_native.exe --version
          objdump -p elliprof_native.exe | grep "DLL Name" || true
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", architecture: arm64}
      - name: Regression outputs of the flang backend
        shell: bash
        run: |
          export PATH="${{ steps.msys2.outputs.msys2-location }}/clangarm64/bin:$PATH"
          python -c "import platform; print(platform.machine())"
          python -m pip install --only-binary=:all: numpy pandas astropy pytest
          export ELLIPROF_NATIVE="$PWD/elliprof_native.exe" PYTHONPATH=python
          python -m pytest tests/regression -q -rxXs || true
          python tests/regression/collect_outputs.py spread/windows-arm64-flang
          python tests/regression/compare_platforms.py tests/regression/baseline spread/windows-arm64-flang
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: windows-arm64-probe-spread, path: spread/}
