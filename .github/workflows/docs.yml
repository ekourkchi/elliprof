# Documentation site (MkDocs + Material), GitHub Pages.
# Manual only: it never runs on push, pull request or release, and it is
# independent of ci.yml, wheels.yml and release.yml.
#   Run workflow, deploy unticked -> build and check the site, upload it as
#                                    an artifact for review (nothing published)
#   Run workflow, deploy ticked   -> build, check and publish to GitHub Pages
# Publishing needs Settings -> Pages -> Source: "GitHub Actions".
name: docs

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to GitHub Pages (otherwise build and check only)"
        type: boolean
        default: false

concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install MkDocs
        run: python -m pip install -r requirements-docs.txt

      # --strict: any broken internal link, missing page or anchor fails
      - name: Build
        run: mkdocs build --strict

      - name: Upload site for review
        if: ${{ !inputs.deploy }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 7

      - name: Upload Pages artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Publish to GitHub Pages
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
