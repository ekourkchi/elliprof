# Source builds and the full test suite.
# NOTE: written and checked locally, but not yet run on GitHub (the
# repository has no GitHub remote yet).
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04,     python: "3.12"}
          - {os: ubuntu-24.04,     python: "3.11"}
          - {os: ubuntu-24.04,     python: "3.13"}
          - {os: ubuntu-24.04-arm, python: "3.12"}
          - {os: macos-15,         python: "3.12"}   # arm64
          - {os: macos-15-intel,   python: "3.12"}   # x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran libcfitsio-dev pkg-config

      - name: Native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc cfitsio
          # make plain `gfortran` point at Homebrew's
          ln -sf "$(brew --prefix)/bin/gfortran-$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)" /usr/local/bin/gfortran || true
          gfortran --version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Python dependencies
        run: python -m pip install numpy pandas astropy pytest

      - name: Source checksums of the protected original files
        run: python -m pytest tests/unit/test_source_hashes.py

      - name: Build and run all tests
        run: make PYTHON=python check

      - name: Regression outputs for the cross-platform comparison
        if: matrix.python == '3.12'
        run: python tests/regression/collect_outputs.py spread/${{ matrix.os }}

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: spread-${{ matrix.os }}
          path: spread/

  docker:
    name: Docker (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make docker-test

  spread:
    name: Cross-platform numerical spread
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install numpy pandas astropy
      - uses: actions/download-artifact@v4
        with: {path: spread, pattern: spread-*, merge-multiple: true}
      - name: Compare every platform with the committed baselines
        run: |
          python tests/regression/compare_platforms.py tests/regression/baseline spread/* | tee spread-report.md
      - uses: actions/upload-artifact@v4
        with: {name: spread-report, path: spread-report.md}
